name: Taviq Basic Tests
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality-gate:
    name: Taviq Quality Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v6
        with:
          go-version: '1.23'
      - name: Taviq contract lint
        run: python3 scripts/lint_contract.py
      - name: Integration Python compile check
        run: python3 -m compileall -q scripts
      - name: Go format check
        run: |
          gofmt -d cmd/taviq || true\n          files="$(gofmt -l cmd/taviq)"
          test -z "$files" || { echo "gofmt required:"; echo "$files"; exit 1; }
      - name: Go Core tests
        run: go test ./cmd/taviq
      - name: Go Core benchmark
        run: python3 scripts/benchmark_go_spike.py
      - name: Go binary distribution acceptance
        run: python3 scripts/test_go_distribution_spike.py
