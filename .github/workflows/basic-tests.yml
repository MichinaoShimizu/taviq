name: Taviq Basic Tests
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality-gate:
    name: Taviq Quality Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v6
        with:
          go-version: '1.23'
      - name: Taviq contract lint
        run: python3 scripts/lint_contract.py
      - name: Python compile check
        run: python3 -m compileall -q scripts tests
      - name: Go spike tests
        run: go test ./cmd/taviq
      - name: Go spike benchmark
        run: python3 scripts/benchmark_go_spike.py
      - name: Go distribution spike
        run: python3 scripts/test_go_distribution_spike.py
      - name: Unit tests
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Basic overhead benchmark
        run: |
          python3 scripts/benchmark_basic.py | tee /tmp/taviq-benchmark.json
          python3 - <<'PY'
          import json
          r=json.load(open('/tmp/taviq-benchmark.json'))
          assert r['passes']['hook_median'], r
          assert r['passes']['metadata_size'], r
          PY
